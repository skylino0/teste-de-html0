<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*
            height = altura
            width = largura 
            border = borda 
            padding = engrossar 
            margin = margen
            outline = traçado
        */
        /*
            box-level = um box quebra linha // [div,h1-h6,p,main,header,nav,article,asdide,footer,form,video,]
            inline-level = o box continua a linha // [span,a,code,small,strong,em,sup-sub,label,button,input,select]
        */
        h1{
            background-color: bisque;
            height: 300px;
            width: 300px;

            border: 10px solid darkcyan;

            /*border-width:10px ;
            border-style:solid ;
            border-color: darkslateblue;*/

            padding: 10px ;

            /*padding-left: 10px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-right: 10px;*/

            margin: 10px auto 10px auto ;

            /*margin-top: 10px; 
            margin-right :10px;
            margin-left :10px;
            margin-bottom :10px ;*/

            outline: 5px dashed darkblue ;
        }

        a{
            border-width: 10px;
            border-style: solid;
            border-color: red;
            padding-left: 10px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-right: 10px;
        }

    </style>
    
</head>
<body>
    <h1>exemplo de caixa box-level</h1>
    <p>paragrafes tambem sao exemplos de box-level, mas os <a href="">links sao exemplos de caixas inline-level</a>vamos ver como tudo isso funciona. </p>
</body>
</html>
