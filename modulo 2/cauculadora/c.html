<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
    <link rel="stylesheet" href="tre.css">
</head>
<body>
    <section id="casa">
            <input type="text" readonly id="call">
           
            <section id="numeros">
                 
                <div class="num">1</div>
                <div class="num">2</div>
                <div class="num">3</div>
               <div class="op">+</div>
                <div class="num">4</div>
                <div class="num">5</div>
                <div class="num">6</div>
                 <div class="op">-</div>
                <div class="num">7</div>
                <div class="num">8</div>
                <div class="num">9</div>
                 <div class="op">*</div>
                <div class="num zero">0</div>
                 <div class="op">=</div>
                <div class="op">/</div>
                <div class="op">C</div>
            </section>
                            


    </section>
    <script src="link.js"></script>
</body>
</html>
