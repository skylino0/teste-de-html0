<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>

        /*  SELETORES PERSONALIZADOS
            # = id 
            . = class
            : = pseudo-class
            :: = pseudo-element
            > = cleldren
        */
        body{
            font-family:Arial, Helvetica, sans-serif;
        }
        a{
            color: #ff0000;
        }
        a:visited{
            color: aqua;
        }
        a:hover{
            color: black;
            text-decoration: underline;

        }
        a:active{
            color: blue;
        }
        a::before{
            content:'♣ ' ;
            font-weight: normal;
            color: darkgreen;
        }
        a::after{
            content:' ♦';
            text-decoration: none;
            font-weight: normal;
            color: darkgreen;
        }
    </style>

</head>
<body>
    <h1>personalizando links</h1>
    <ul>
        <li><a href="https://github.com/account"target="_blank" >repositorio Github</a></li>
        <li><a href="https://youtube.com/@wendelgabriel5086?si=qyMnaNao6bNFaeM9 "target="_blank">canal do you tube</a></li>
        <li><a href="https://www.cursoemvideo.com"target="_blank" >site do curso em video</a></li>
    </ul>
</body>
</html>
